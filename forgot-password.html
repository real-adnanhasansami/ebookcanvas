<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password - Ebook Canvas</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="site-nav">
  <div class="container row">
    <a class="brand" href="index.html"><span class="brand-mark"></span><span class="brand-name">Ebook Canvas</span></a>
    <div class="nav-links"><a href="index.html">Home</a><a href="library.html">Library</a></div>
    <div class="nav-actions" id="nav-actions"></div>
  </div>
</nav>

<div class="center-page">
  <div class="container-narrow" style="width:100%; max-width:420px;">
    <div class="form-card">
      <h2>Reset your password</h2>
      <p style="margin-bottom:26px;">Enter your email and we'll send a reset link.</p>
      <form id="reset-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="email" />
        </div>
        <button class="btn btn-primary btn-full" type="submit">Send reset link</button>
      </form>
      <p style="margin-top:18px; font-size:.85rem; text-align:center;">
        <a class="muted-link" href="login.html">Back to log in</a>
      </p>
    </div>
  </div>
</div>

<script type="module">
  import { resetPassword, friendlyAuthError } from "./js/auth.js";
  import { toast } from "./js/main.js";

  document.getElementById("reset-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    try {
      await resetPassword(email);
      toast("Reset link sent - check your inbox.");
    } catch (err) {
      toast(friendlyAuthError(err));
    }
  });
</script>
</body>
</html>
