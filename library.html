<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Library — Ebook Canvas</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="site-nav">
  <div class="container row">
    <a class="brand" href="index.html"><span class="brand-mark"></span><span class="brand-name">Ebook Canvas</span></a>
    <div class="nav-links"><a href="index.html">Home</a><a href="library.html" class="active">Library</a><a href="contact.html">Premium</a><a href="legal.html">About</a></div>
    <div class="nav-actions" id="nav-actions"></div>
  </div>
</nav>

<div class="ad-slot ad-top" data-ad="top" style="display:none;"></div>

<section class="section container">
  <h1 style="font-size:2rem;">The library</h1>
  <p>Every book on the shelf — search, browse by genre, or sort by what's trending.</p>

  <div class="library-search">
    <input id="search-input" type="text" placeholder="Search by title or author…" />
    <div class="filter-tabs">
      <button class="filter-tab filter-active" data-sort="all">All</button>
      <button class="filter-tab" data-sort="newest">Newest</button>
      <button class="filter-tab" data-sort="trending">Trending</button>
      <button class="filter-tab" data-sort="rating">Top rated</button>
    </div>
  </div>
  <div class="genre-pills" id="genre-pills"></div>

  <div class="shelf-grid" id="full-library-shelf">
    <p class="field-hint">Loading the library…</p>
  </div>
</section>

<footer>
  <div class="container row">
    <div>© <span id="year"></span> Ebook Canvas.</div>
    <div style="display:flex; gap:18px;"><a href="contact.html">Contact</a><a href="legal.html">Terms &amp; Privacy</a></div>
  </div>
</footer>

<script type="module">
  import { fetchPublishedBooks, bookCardHTML, getBookRating } from "./js/main.js";
  import { watchAuth } from "./js/auth.js";

  let books = [];
  let currentSort = "all";
  let currentGenre = "all";
  let searchTerm = "";
  let ratingsCache = {};

  function render() {
    const shelf = document.getElementById("full-library-shelf");
    let list = books.filter((b) => {
      const matchesGenre = currentGenre === "all" || (b.genre || "").toLowerCase() === currentGenre;
      const matchesSearch = !searchTerm ||
        (b.title || "").toLowerCase().includes(searchTerm) ||
        (b.author || "").toLowerCase().includes(searchTerm);
      return matchesGenre && matchesSearch;
    });

    if (currentSort === "newest") list.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    else if (currentSort === "trending") list.sort((a, b) => (b.readCount || 0) - (a.readCount || 0));
    else if (currentSort === "rating") list.sort((a, b) => (ratingsCache[b.id]?.avg || 0) - (ratingsCache[a.id]?.avg || 0));

    if (list.length === 0) {
      shelf.innerHTML = `<p class="field-hint">No books match that search.</p>`;
      return;
    }
    shelf.innerHTML = list.map(bookCardHTML).join("");
  }

  function renderGenrePills() {
    const genres = [...new Set(books.map((b) => (b.genre || "").trim()).filter(Boolean))];
    const pillsEl = document.getElementById("genre-pills");
    if (genres.length === 0) { pillsEl.style.display = "none"; return; }
    pillsEl.innerHTML = `<button class="filter-tab filter-active" data-genre="all">All genres</button>` +
      genres.map((g) => `<button class="filter-tab" data-genre="${g.toLowerCase()}">${g}</button>`).join("");
    pillsEl.querySelectorAll("[data-genre]").forEach((btn) => {
      btn.addEventListener("click", () => {
        pillsEl.querySelectorAll("[data-genre]").forEach((b) => b.classList.remove("filter-active"));
        btn.classList.add("filter-active");
        currentGenre = btn.dataset.genre;
        render();
      });
    });
  }

  document.querySelectorAll("[data-sort]").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-sort]").forEach((b) => b.classList.remove("filter-active"));
      btn.classList.add("filter-active");
      currentSort = btn.dataset.sort;
      render();
    });
  });

  document.getElementById("search-input").addEventListener("input", (e) => {
    searchTerm = e.target.value.trim().toLowerCase();
    render();
  });

  watchAuth(async (user) => {
    const shelf = document.getElementById("full-library-shelf");
    if (!user) {
      shelf.innerHTML = `<p class="field-hint"><a href="signup.html">Sign up</a> or <a href="login.html">log in</a> to browse the library.</p>`;
      return;
    }
    try {
      books = await fetchPublishedBooks();
    } catch (e) {
      shelf.innerHTML = `<p class="field-hint">Couldn't load the library right now.</p>`;
      return;
    }
    if (books.length === 0) {
      shelf.innerHTML = `<p class="field-hint">The library is empty right now.</p>`;
      return;
    }
    renderGenrePills();
    render();
    // Ratings load in the background and re-render once ready (used by "Top rated" sort).
    Promise.all(books.map((b) => getBookRating(b.id).then((r) => (ratingsCache[b.id] = r)))).then(render);
  });
</script>
<script type="module" src="js/main.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
